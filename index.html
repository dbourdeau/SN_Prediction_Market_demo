<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkNinja Prediction Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230059a3'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>📈</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shark: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9dffe',
                            300: '#7cc5fd',
                            400: '#36a9fa',
                            500: '#0c8eeb',
                            600: '#0070c9',
                            700: '#0059a3',
                            800: '#054b86',
                            900: '#0a3f6f',
                            950: '#07284a',
                        },
                        ninja: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #07284a 0%, #0059a3 50%, #0c8eeb 100%); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .prob-bar { transition: width 0.5s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 3px solid #0c8eeb; color: #0c8eeb; font-weight: 600; }
        .prediction-btn { transition: all 0.15s ease; }
        .prediction-btn:hover { transform: scale(1.02); }
        .prediction-btn:active { transform: scale(0.98); }
        .tooltip { position: relative; }
        .tooltip::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .tooltip:hover::after { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.15s ease; }
        .modal-content { background: white; border-radius: 1rem; padding: 1.5rem; max-width: 28rem; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: modalSlide 0.2s ease; }
        @keyframes modalSlide { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        /* Hide scrollbar on mobile nav */
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        /* Skeleton pulse */
        .skeleton-line { height: 1rem; background: #e5e7eb; border-radius: 0.375rem; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* Dark mode overrides */
        .dark body, .dark .bg-gray-50 { background-color: #111827 !important; }
        .dark .bg-white { background-color: #1f2937 !important; }
        .dark .bg-gray-50:not(body) { background-color: #1a2332 !important; }
        .dark .bg-gray-100 { background-color: #374151 !important; }
        .dark .text-gray-900 { color: #f9fafb !important; }
        .dark .text-gray-700 { color: #d1d5db !important; }
        .dark .text-gray-600 { color: #9ca3af !important; }
        .dark .text-gray-500 { color: #9ca3af !important; }
        .dark .text-gray-400 { color: #6b7280 !important; }
        .dark .border-gray-200 { border-color: #374151 !important; }
        .dark .border-gray-100 { border-color: #1f2937 !important; }
        .dark .border-gray-300 { border-color: #4b5563 !important; }
        .dark .divide-gray-50 > :not([hidden]) ~ :not([hidden]) { border-color: #374151 !important; }
        .dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #374151 !important; }
        .dark input, .dark textarea, .dark select { background-color: #374151 !important; border-color: #4b5563 !important; color: #f9fafb !important; }
        .dark .modal-content { background-color: #1f2937 !important; }
        .dark .skeleton-line { background: #374151 !important; }
        .dark .hover\:bg-gray-50:hover { background-color: #374151 !important; }
        .dark .hover\:bg-gray-100:hover { background-color: #4b5563 !important; }
        .dark .hover\:bg-gray-200:hover { background-color: #4b5563 !important; }
        .dark .bg-gray-100.text-gray-700 { background-color: #374151 !important; color: #e5e7eb !important; }
        .dark .bg-gray-50.rounded-lg { background-color: #1a2332 !important; }
        .dark .bg-blue-50 { background-color: #1e293b !important; }
        .dark .border-blue-200 { border-color: #1e3a5f !important; }
        .dark .text-blue-700 { color: #93c5fd !important; }
        .dark .text-blue-500 { color: #60a5fa !important; }
        .dark .bg-amber-50 { background-color: #292524 !important; }
        .dark .border-amber-200 { border-color: #92400e !important; }
        .dark .bg-green-100 { background-color: #064e3b !important; }
        .dark .text-green-700 { color: #6ee7b7 !important; }
        .dark .bg-red-100 { background-color: #7f1d1d !important; }
        .dark .text-red-700 { color: #fca5a5 !important; }
        .dark .bg-blue-100 { background-color: #1e3a5f !important; }
        .dark .text-blue-700 { color: #93c5fd !important; }
        .dark .bg-purple-100 { background-color: #3b0764 !important; }
        .dark .text-purple-700, .dark .text-purple-600 { color: #c4b5fd !important; }
        .dark .bg-shark-50 { background-color: #0c2d4a !important; }
        .dark .text-shark-700 { color: #7dd3fc !important; }
        .dark .bg-orange-100 { background-color: #431407 !important; }
        .dark .text-orange-700 { color: #fdba74 !important; }
        .dark .card-hover:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data.js"></script>
    <script src="js/amm.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
