<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkPool</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230059a3'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>🦈</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shark: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9dffe',
                            300: '#7cc5fd',
                            400: '#36a9fa',
                            500: '#0c8eeb',
                            600: '#0070c9',
                            700: '#0059a3',
                            800: '#054b86',
                            900: '#0a3f6f',
                            950: '#07284a',
                        },
                        ninja: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* 1. Glassmorphism header */
        .gradient-bg {
            background: linear-gradient(135deg, rgba(7,40,74,0.85) 0%, rgba(0,89,163,0.85) 50%, rgba(12,142,235,0.85) 100%);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-color: #d1d5db !important; }
        .prob-bar { transition: width 0.5s ease; }
        /* 5. Page transitions */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        main { animation: pageIn 0.25s ease-out; }
        @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
        /* 2. Animated probability counter */
        @keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .prob-animate { animation: countUp 0.4s ease-out backwards; }
        /* 7. Live pulse for active markets */
        .pulse-live { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; position: relative; }
        .pulse-live::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: rgba(34,197,94,0.4); animation: livePulse 2s ease-in-out infinite; }
        @keyframes livePulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.8); opacity: 0; } }
        /* Smooth transitions on interactive elements */
        button, a, input, select, textarea { transition: all 0.15s ease; }
        /* Category color accents on cards */
        .card-accent-blue { border-left: 3px solid #3b82f6; }
        .card-accent-red { border-left: 3px solid #ef4444; }
        .card-accent-green { border-left: 3px solid #22c55e; }
        .card-accent-purple { border-left: 3px solid #a855f7; }
        .card-accent-amber { border-left: 3px solid #f59e0b; }
        .card-accent-pink { border-left: 3px solid #ec4899; }
        .tab-active { border-bottom: 3px solid #0c8eeb; color: #0c8eeb; font-weight: 600; }
        .prediction-btn { transition: all 0.15s ease; }
        .prediction-btn:hover { transform: scale(1.02); }
        .prediction-btn:active { transform: scale(0.98); }
        .tooltip { position: relative; }
        .tooltip::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .tooltip:hover::after { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.15s ease; }
        .modal-content { background: white; border-radius: 1rem; padding: 1.5rem; max-width: 28rem; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalSlide 0.2s ease; }
        @keyframes modalSlide { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        /* Hide scrollbar on mobile nav */
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        /* Skeleton pulse */
        .skeleton-line { height: 1rem; background: #e5e7eb; border-radius: 0.375rem; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* Line clamp */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* Top progress bar */
        .nav-progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #0c8eeb, #36a9fa); z-index: 200; border-radius: 0 2px 2px 0; animation: navProgress 1.8s ease-in-out infinite; }
        @keyframes navProgress { 0% { width: 0; } 40% { width: 70%; } 80% { width: 90%; } 100% { width: 95%; } }
        .nav-progress-done { animation: none; width: 100%; opacity: 0; transition: opacity 0.3s ease 0.1s; }
        /* Guided tour overlay */
        .tour-overlay { position: fixed; inset: 0; z-index: 300; pointer-events: auto; }
        .tour-overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .tour-tooltip { position: fixed; z-index: 301; background: white; border-radius: 12px; padding: 20px; max-width: 340px; width: calc(100vw - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: modalSlide 0.25s ease; }
        .tour-tooltip::before { content: ''; position: absolute; width: 12px; height: 12px; background: white; transform: rotate(45deg); }
        .tour-tooltip.arrow-top::before { top: -6px; left: 24px; }
        .tour-tooltip.arrow-bottom::before { bottom: -6px; left: 24px; }
        .tour-tooltip.arrow-left::before { left: -6px; top: 24px; }
        .tour-step-dots { display: flex; gap: 6px; }
        .tour-step-dots span { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; transition: all 0.2s; }
        .tour-step-dots span.active { background: #0c8eeb; width: 20px; border-radius: 4px; }
        /* Dark mode overrides - minimal, rest injected after Tailwind loads */
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>

        /* SharkNinja brand colors in dark */

        /* Card hover in dark */

        /* Table header in dark */

        /* Gradient header — keep as-is, it's already dark */
